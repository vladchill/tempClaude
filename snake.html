<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
  }
  h1 { font-size: 2rem; margin-bottom: 10px; letter-spacing: 4px; color: #00e676; }
  #scoreboard {
    font-size: 1.1rem;
    margin-bottom: 12px;
    display: flex;
    gap: 30px;
  }
  #scoreboard span { color: #00e676; font-weight: bold; }
  canvas {
    border: 2px solid #00e676;
    border-radius: 4px;
    box-shadow: 0 0 20px #00e67644;
  }
  #msg {
    margin-top: 16px;
    font-size: 1rem;
    color: #aaa;
  }
</style>
</head>
<body>
<h1>SNAKE</h1>
<div id="scoreboard">Score: <span id="score">0</span> &nbsp; Best: <span id="best">0</span></div>
<canvas id="c" width="500" height="500"></canvas>
<div id="msg">Arrow keys or WASD to move &nbsp;|&nbsp; R to restart</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CELL = 20;
const COLS = canvas.width / CELL;
const ROWS = canvas.height / CELL;

let snake, dir, nextDir, food, score, best, running, loop;
best = 0;

function init() {
  snake = [
    {x: Math.floor(COLS/2), y: Math.floor(ROWS/2)},
    {x: Math.floor(COLS/2)-1, y: Math.floor(ROWS/2)},
    {x: Math.floor(COLS/2)-2, y: Math.floor(ROWS/2)},
  ];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  running = true;
  spawnFood();
  if (loop) clearInterval(loop);
  loop = setInterval(tick, 120);
  document.getElementById('score').textContent = 0;
}

function spawnFood() {
  let pos;
  do {
    pos = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)};
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    running = false;
    clearInterval(loop);
    draw(true);
    return;
  }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    if (score > best) best = score;
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
    spawnFood();
  } else {
    snake.pop();
  }
  draw(false);
}

function draw(gameOver) {
  // Background
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = '#1e1e3a';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= canvas.width; x += CELL) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for (let y = 0; y <= canvas.height; y += CELL) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

  // Food (pulsing red circle)
  ctx.fillStyle = '#ff1744';
  ctx.shadowColor = '#ff1744';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  snake.forEach((s, i) => {
    const ratio = 1 - i / snake.length * 0.6;
    ctx.fillStyle = i === 0 ? '#00e676' : `rgba(0, ${Math.floor(180*ratio)}, ${Math.floor(100*ratio)}, 1)`;
    if (i === 0) { ctx.shadowColor = '#00e676'; ctx.shadowBlur = 8; }
    ctx.beginPath();
    ctx.roundRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2, 4);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff1744';
    ctx.font = 'bold 42px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 30);

    ctx.fillStyle = '#fff';
    ctx.font = '20px Arial';
    ctx.fillText(`Score: ${score}`, canvas.width/2, canvas.height/2 + 10);

    ctx.fillStyle = '#aaa';
    ctx.font = '16px Arial';
    ctx.fillText('Press R to restart', canvas.width/2, canvas.height/2 + 45);
  }
}

document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp':    case 'w': case 'W': if (dir.y === 0) nextDir = {x:0, y:-1}; break;
    case 'ArrowDown':  case 's': case 'S': if (dir.y === 0) nextDir = {x:0, y:1};  break;
    case 'ArrowLeft':  case 'a': case 'A': if (dir.x === 0) nextDir = {x:-1,y:0};  break;
    case 'ArrowRight': case 'd': case 'D': if (dir.x === 0) nextDir = {x:1, y:0};  break;
    case 'r': case 'R': init(); break;
  }
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});

init();
draw(false);
</script>
</body>
</html>
